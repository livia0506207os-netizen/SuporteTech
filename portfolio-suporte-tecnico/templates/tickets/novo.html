{% extends "base.html" %}
{% block title %}Abrir Chamado{% endblock %}
{% block content %}

<h2><i class="fa-solid fa-plus"></i> Abrir novo chamado</h2>

<div class="card p-4 mt-3" style="max-width: 700px;">
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Usuário</label>
      <input type="text" class="form-control" name="usuario" placeholder="Nome do usuário/solicitante" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Descrição do problema</label>
      <textarea class="form-control" name="problema" rows="4" placeholder="Descreva o problema relatado" required></textarea>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Categoria</label>
        <select class="form-select" name="categoria">
          {% for cat in categorias %}
          <option value="{{ cat }}">{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Prioridade</label>
        <select class="form-select" name="prioridade">
          {% for p in prioridade_choices %}
          <option value="{{ p }}" {% if p == "Média" %}selected{% endif %}>{{ p }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Registrar chamado</button>
    <a href="{{ url_for('tickets.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>

{% endblock %}
